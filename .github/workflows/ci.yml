name: CI

# 触发：PR 与 main 推送。要真正「PR 必过」还需在仓库设置里把下面两个 job
# 加进分支保护的 Required status checks（见文件末尾注释）。
on:
  pull_request:
  push:
    branches: [main]

# 同一引用上的新提交作废上一次运行，避免排队浪费额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (lint / typecheck / unit / api / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由子项目 package.json 的 packageManager 字段决定，
      # 与本地/线上锁死同一版，避免版本切换导致 lockfile 差异。
      # 必须显式指 package_json_file：action-setup 未给 version 时读的是**仓库根**的
      # package.json，而根目录不是 workspace、压根没有 package.json（实测 CI 在此步直接退 1，
      # defaults.run.working-directory 对 uses: 步骤不生效，兜不住它）。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # 22 = 线上运行镜像（deploy/docker-compose.deploy.yml 的 node:22-alpine）。
          # 本地是 24/25，用线上版本跑才有意义——Vercel AI SDK 的流式行为不要依赖未发布特性
          node-version: '22'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      # postinstall 会跑 nuxi prepare，产出 .nuxt 类型声明，typecheck 依赖它
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: API tests
        run: pnpm test:api

      # 构建产物也要过 CI：typecheck 通过不代表 vite/nitro 打包通过
      # （依赖解析、SSR 水合期外的编译错误只有 build 才暴露）
      - name: Build
        run: pnpm build

  game-web:
    name: game-web (lint / typecheck / unit / component / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: game-web
    steps:
      - uses: actions/checkout@v4

      # 同上：根目录无 package.json，必须显式指到子项目
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game-web/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: game-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Component tests
        run: pnpm test:component

      # H5 构建（game-web 没有裸 build 脚本，build:h5 是等价门禁项）
      - name: Build
        run: pnpm build:h5

  # 浏览器端到端：只跑「不依赖后端」的那批——用 page.route 打桩，或干脆只读 localStorage。
  # 本机实测（不起 server、无 LLM key）：42 例 / 29 秒全绿，所以值得占一个 job。
  # CI 首跑（run #23）整 job 107s。另外证过一件事，免得这是个假门禁：
  # --grep 匹配不到任何用例时 Playwright 报 "No tests found" 并退 1，
  # 所以这里的"绿"不可能来自空跑。
  # 三条依赖真实后端与 LLM 的用例（full-journey-real / faction-negotiation /
  # free-action-faction-effects）标题统一带 [real-backend]，由 --grep-invert 排除：
  # 它们要 AI key、要真库，还要为 LLM 的非确定性做软跳过（test.skip），
  # 塞进 CI 只会产出随机红——那是比没有覆盖更糟的东西。
  e2e:
    name: game-web e2e (mock-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: game-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game-web/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: game-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --with-deps 顺带装系统库：runner 上 chromium 缺这些会以「启动即崩」的形态
      # 伪装成用例失败，排查方向完全被带偏
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # dev server 由 playwright.config.ts 的 webServer 负责起（PLAYWRIGHT_E2E=1 →
      # 固定 5180 + strictPort，uni 命令不透传 --port 给 Vite，只能走环境变量条件配置）
      - name: Run e2e
        run: pnpm exec playwright test --grep-invert "real-backend"

      # 失败时把 trace/报告留成产物，否则 CI 上那一红只能靠重跑碰运气
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            game-web/playwright-report
            game-web/test-results
          retention-days: 5

  # 规格校验：openspec 不是任一子项目的依赖，本地是 npm 全局安装的 @fission-ai/openspec，
  # 所以这里用 npx --yes 拉同一版本（1.5.0，与本地一致）跑校验。
  # --all 覆盖 specs/ 全部 canonical spec 与 changes/ 全部在途提案；--strict 要求
  # 每条 Requirement 正文含 SHALL/MUST、spec 必须有 ## Purpose 与 ## Requirements。
  # 独立成 job 而非 step：可与两个子项目的检查并行，且 status check 名能单独加进分支保护。
  openspec:
    name: openspec (validate --all --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate specs and in-flight changes
        run: npx --yes @fission-ai/openspec@1.5.0 validate --all --strict

# ── 让 CI 成为 PR 门禁（一次性仓库设置，不在本文件里生效）────────────────
# 路径：Settings → Branches → Add branch protection rule
#   Branch name pattern: main
#   勾选 Require a pull request before merging
#   勾选 Require status checks to pass before merging，搜索并添加：
#     server (lint / typecheck / unit / api / build)
#     game-web (lint / typecheck / unit / component / build)
#     game-web e2e (mock-backed)
#     openspec (validate --all --strict)
#   （job 的 name 就是 status check 名，改了 name 要同步改这里的勾选。
#     e2e 是 2026-10-14 新增的第 4 个：本机实测 42 例 / 29 秒，CI 整 job 107s）
# 命令行等价操作（需 gh 认证，且属于改动共享状态，请人工确认后再执行）：
#   gh api -X PUT /repos/MrC-Sinclair/jintian-1851/branches/main/protection   # 需要 --input 传完整 JSON
# 注意：本文件首次真实执行就红了——两个 job 均止步于 pnpm/action-setup，
#       lint/typecheck/测试一行都没跑到。原因是根目录没有 package.json 可供读取
#       pnpm 版本（本仓库是两个独立子项目、根目录刻意不是 workspace）。
#       本地对应 gate 全绿后才补的这次修正：game-web 另有 test:component
#       （15 文件 / 354 用例），此前不在验证矩阵里。
