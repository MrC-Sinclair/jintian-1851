# 金田：1851 — 线上部署编排（CVM 独立项目，与 mychat 那套互不影响）
#
# 用法（在服务器上，项目目录 /root/jintian）：
#   docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env up -d postgres
#   docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env up -d
# 项目名固定 jintian，卷前缀 jintian_，不会和 mychat 的 deploy_* 撞名。
#
# 为什么端口不是 80/443：机器上 mychat 的 Caddy 已独占 80/443，且只有公网 IP 无域名，
# 客户端按 IP 建 TLS 连接时 ClientHello 不带 SNI，两个具名站点无法在同端口区分。
# 所以本项目另起一套监听 8443（HTTPS）/ 8081（跳转 HTTPS）。
#
# 为什么这里不放构建：2C2G 的机器跑 Nuxt + uni-app 构建会 OOM，
# 产物一律本机 `pnpm build` / `pnpm build:h5` 后上传到 deploy/dist/。
#
# ⚠️ 更新产物的正确姿势：解包覆盖 dist/ 之后必须
#   docker compose -f docker-compose.deploy.yml --env-file .env up -d --force-recreate app caddy
# 单纯 `up -d` 不算配置变更、不会重建容器；而若解包前 rm -rf 过 dist/.output 或 dist/h5，
# 容器的 bind mount 仍指向已删除的旧 inode，结果是新产物完全不生效——
# 表现为接口仍返回旧版本行为、静态站直接 404（两者都实测踩过）。
# 更稳的做法是不删目录、原地 tar -xzf 覆盖，可避开 inode 问题。
#
# 版本台账（openspec 停用后，这里代替原先那份「线上对应哪个 commit」的记录）：
#   2026-10-16  h5 = 0d6b5c9（客户端能响应 403 PROOF_REQUIRED）
#               .output = 0d6b5c9（持有证明闸门；REQUIRE_POSSESSION=false，只观测不拦截）
#   2026-10-15  h5 = 506e7c1（开局势力整包降级角标；上一条 b3cdf64 为备选事件角标）
#               .output = 9d2e5ba（首绑观测事件 + 观测查询不得连带把注册打成 500）
#   2026-10-14  h5 = 4ea8fa5（决策失败文案不再一律报"网络连接失败"）
#               .output = 4ebde06（advisor-briefing 用量日志带 saveId/turn），容器内 mtime 14:34
#   ⚠ 日志取法（2026-10-16 更正，此前这条注释写错了）：本机容器日志驱动是 **journald**，
#     `docker logs jintian-api` 只显示**当前容器**，所以 recreate 之后看起来像"清零"，
#     但 journal 里历史一直在（实测可取到 10-10 起 446 行）。收紧判断请查 journal：
#       journalctl CONTAINER_NAME=jintian-api -o short-iso --no-pager --since "7 days ago" | pnpm auth-report
#     `-o short-iso` 保留行首时间戳，聚合侧据此做区间/按天统计；`-o cat` 会丢时间戳。
#   ⚠ 本文件在服务器上是**独立副本**（/root/jintian/deploy/），改这里必须一并上传，否则新增的
#     NUXT_ 环境变量根本不会传进容器。2026-10-16 就是这样发现 REQUIRE_POSSESSION 翻不动的：
#     服务器那份停在 10-14，diff 确认没有服务器本地改动后才覆盖（覆盖前留
#     docker-compose.deploy.yml.bak-20261016）。传完先 `config --quiet` 校验，
#     再 `docker exec jintian-api env` 确认真进了容器，别只信"up -d 没报错"。
#   回滚副本在服务器上（解包前 cp -a 留的）：
#     dist/h5.bak-20261013 / -20261013-401fix / -20261014-toastfix / -20261015-degraded-toast
#       / -20261015-event-badge / -20261015-faction-badge / -20261016-proof
#     dist/.output.bak-20261013 / -20261014 / -20261014b / -20261015-auth-observe / -20261016-proof
#
# 鉴权开关：deploy/.env 已显式写 NUXT_DEVICE_AUTH_ENFORCED=true（10-15 第一步，备份
# .env.bak-20261015-enforce）。原计划第二步 ALLOW_FIRST_BIND=false 已作废——它保护不到
# 已注册设备，代价却是新装用户全部失去云端同步；改用定向闸门
# NUXT_DEVICE_AUTH_REQUIRE_POSSESSION（当前 false = 只观测）。
# 翻开它的先决条件与判定分布口径见 docs/API.md 的 device-credential 一节。

name: jintian

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: jintian-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ⚠️ 必须绑 127.0.0.1：写成 "5544:5432" 等于把数据库开放到公网，
    # 而本机安全组 0.0.0.0/0 放行端口，一旦暴露就会被扫库。
    # 这里回环映射只服务一个用途：本机 ssh -L 隧道跑 drizzle-kit push（表结构同步）。
    # 5544 而非 5534/5444：避开 mychat 的 5444 与仓库开发用的 5534。
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      # PG18 起挂载点必须是 /var/lib/postgresql（挂 .../data 会让容器 exit 1，
      # 完整原理与 PG17→18 的数据迁移路径见根目录 docker-compose.yml 注释）
      - pgdata:/var/lib/postgresql
      # pgvector 扩展初始化：与开发环境共用同一份 initdb 脚本
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # 2G 内存的机器要给容器设上限，否则 postgres 与 node 争抢时会被 OOM killer 随机杀
    mem_limit: 512m

  app:
    # 只跑已构建好的 Nitro 产物，容器内不装依赖、不构建
    image: node:22-alpine
    container_name: jintian-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server/index.mjs"]
    volumes:
      - ./dist/.output:/app:ro
      # 备份状态文件（由 deploy/backup-db.sh 每次运行时落在此目录）。
      # ⚠ 挂目录而不是挂单个文件：文件还不存在时 Docker 会在宿主路径上建一个**同名目录**，
      #   结果备份脚本写不进去、健康端点永远读到一个目录 —— 静默失效且很难看出来。
      # 该目录里的 .sql.gz 对本容器只是"多可读了一遍"：同一个容器本来就能直连这个库把它 dump 出来，
      # 没有新增泄露面。
      - ../backups:/data/backups:ro
    environment:
      # 运行时以 NUXT_ 前缀覆盖 runtimeConfig：
      # 构建时 nuxt.config 已把本机 .env 的值烘进默认值，
      # 不显式覆盖的话线上会拿本机的库地址和 key 去连，属于静默故障。
      NUXT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NUXT_OPENAI_API_KEY: ${NUXT_OPENAI_API_KEY}
      NUXT_OPENAI_BASE_URL: ${NUXT_OPENAI_BASE_URL}
      NUXT_LLM_MODEL: ${NUXT_LLM_MODEL}
      NUXT_ENABLE_BRIEFING: ${NUXT_ENABLE_BRIEFING}
      # 存档归属鉴权双轨开关（运行时覆盖，不用改代码重新构建）：
      #   ENFORCED=true 关闭「无凭据凭 deviceId 访问」的旧通道
      #   ALLOW_FIRST_BIND=false 关闭新设备注册窗口
      #     ⚠ 代价是所有新装用户从此用不了云端同步，不只是挡住抢注者 —— 已改用
      #        REQUIRE_POSSESSION 做定向闸门（见下），不要再动这个开关
      #   REQUIRE_POSSESSION=true 已有云端存档却首次注册的设备，必须提交 saveId+createdAt
      #     证明持有该存档；新设备不受影响。默认 false = 只观测不拦截（phase 1）
      # 默认值刻意与开发期一致：兼容期开、注册开。收紧时机看 [auth-compat] 日志。
      NUXT_DEVICE_AUTH_ENFORCED: ${NUXT_DEVICE_AUTH_ENFORCED:-false}
      NUXT_DEVICE_AUTH_ALLOW_FIRST_BIND: ${NUXT_DEVICE_AUTH_ALLOW_FIRST_BIND:-true}
      NUXT_DEVICE_AUTH_REQUIRE_POSSESSION: ${NUXT_DEVICE_AUTH_REQUIRE_POSSESSION:-false}
      # 备份新鲜度：health 读这个文件判定 backup=fresh|stale|missing|invalid|disabled。
      # 默认就开启（文件读不到时报 missing，仅是一个字段，不改状态码、不影响容器健康），
      # 所以「装没装新版备份脚本」都不会让现有探活变红。
      NUXT_BACKUP_STATUS_FILE: ${NUXT_BACKUP_STATUS_FILE:-/data/backups/health-status.json}
      NUXT_BACKUP_MAX_AGE_HOURS: ${NUXT_BACKUP_MAX_AGE_HOURS:-30}
      # ⚠️ 同一批值还要以「无前缀」形式再给一遍：
      # server/db/index.ts 读的是 process.env.DATABASE_URL，server/utils/embeddings.ts 读的是
      # process.env.OPENAI_API_KEY —— runtimeConfig 不会反向写回 process.env，
      # 只给 NUXT_ 前缀的话这两处会静默落到硬编码兜底（localhost:5534 / 空 key），
      # 表现为「存档写不进去 + 事件向量记忆全部跳过」，而接口仍返回 200。
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${NUXT_OPENAI_API_KEY}
      OPENAI_BASE_URL: ${NUXT_OPENAI_BASE_URL}
      LLM_MODEL: ${NUXT_LLM_MODEL}
      # Nitro node server 默认 3000，显式写出便于排查
      NUXT_PORT: "3000"
      NODE_ENV: production
    # 仅内部网络可达：不对公网暴露明文 HTTP，站点统一走 caddy 的 TLS 前置
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 打 /api/health 而不是 /api/game/saves：后者会在 rate-limit 中间件里
      # 因缺 x-device-id 直接返 400，连数据库都没碰到，等于只测「进程还在监听」——
      # postgres 挂掉时容器依然 healthy（无声故障）。
      # 现在要求 HTTP 200 且响应体 ok:true，DB 探针失败会返 503 → 容器转 unhealthy。
      # 不会引起重启风暴：这里没有 autoheal，unhealthy 只是状态标记，
      # depends_on 的 service_healthy 只作用于启动顺序。
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const j=await r.json().catch(()=>null);process.exit(r.status===200&&j&&j.ok===true?0:1)}).catch(()=>process.exit(1))"
        ]
      interval: 20s
      # 必须大于服务端 DB 探针的 3s 超时，否则「慢」会被误判成「死」
      timeout: 10s
      retries: 4
      start_period: 30s
    mem_limit: 512m

  caddy:
    image: caddy:2
    container_name: jintian-web
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # H5 静态产物（game-web/dist/build/h5 上传到此）
      - ./dist/h5:/srv/h5:ro
      # 自签证书只在服务器上生成，不入库，生成命令见 deploy/.env.example 注释
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
